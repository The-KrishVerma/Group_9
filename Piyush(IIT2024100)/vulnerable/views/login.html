<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Vulnerable App (Port 3000)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1f1c2c 0%, #3a1c28 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    h1 { margin: 0; font-size: 22px; }
    .badge {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.4px;
    }
    .subtitle { margin: 0 0 20px; color: #64748b; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }
    input:focus { outline: 2px solid #ef4444; border-color: transparent; }
    button {
      width: 100%;
      padding: 11px;
      background: #dc2626;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #b91c1c; }
    .alert.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .hint {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #64748b;
    }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Account Portal</h1>
      <span class="badge">VULNERABLE · :3000</span>
    </div>
    <p class="subtitle">Sign in to manage your email and password.</p>
    {{errorBlock}}
    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" value="alice" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" value="alice123" required>
      <button type="submit">Log In</button>
    </form>
    <div class="hint">
      Demo credentials: <code>alice / alice123</code> or <code>bob / bob123</code>
    </div>
  </div>
</body>
</html>
